[project]
name = "jarvis"
version = "0.0.1"
description = "Context-aware multimodal desktop assistant (self-study build)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    # One client library for every free OpenAI-compatible provider:
    # Gemini, Groq, OpenRouter and local Ollama all speak this API.
    "openai>=1.40",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.1",
    "sounddevice>=0.4.6",
    "kokoro-onnx>=0.6",         # English voices (Apache-2.0)
    "piper-tts>=1.3",           # Sinhala and other Piper voices (GPL-3.0)
    "pedalboard>=0.9",          # voice_style effects chain (GPL-3.0)
    # On 64-bit Windows the GPU build of onnxruntime replaces the CPU build
    # (see [tool.uv] below). It runs on the CPU too, so it works without an
    # NVIDIA card. 1.26 is the newest built for CUDA 12, the CUDA Whisper's
    # CTranslate2 uses; 1.27 and later need CUDA 13.
    "onnxruntime-gpu==1.26.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# Meta MMS-TTS voices (Tamil by default). Pulls in torch, so it's separate.
mms = [
    "transformers>=4.40",
    "torch>=2.2",
]
vision = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
]
desktop = [
    "pynput>=1.7.6",
]
# CUDA 12 libraries that faster-whisper (CTranslate2) needs on Windows.
# Installing them with pip avoids a manual CUDA/cuDNN install.
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
    # The rest of CUDA 12 that onnxruntime needs to run Kokoro on the GPU
    # (4x faster than the CPU on the laptop: 179 vs 770 ms for a sentence).
    "onnxruntime-gpu[cuda,cudnn]==1.26.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.uv]
# The CPU and GPU builds of onnxruntime install the same Python module and
# overwrite each other's files, so 64-bit Windows gets only the GPU build.
override-dependencies = ["onnxruntime; sys_platform != 'win32' or platform_machine != 'AMD64'"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
