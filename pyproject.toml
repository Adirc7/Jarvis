[project]
name = "jarvis"
version = "0.0.1"
description = "Context-aware multimodal desktop assistant (self-study build)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    # One client library for every free OpenAI-compatible provider:
    # Gemini, Groq, OpenRouter and local Ollama all speak this API.
    "openai>=1.40",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.1",
    "sounddevice>=0.4.6",
    "kokoro-onnx>=0.4",         # English voices (Apache-2.0)
    "piper-tts>=1.3",           # Sinhala and other Piper voices (GPL-3.0)
    "pedalboard>=0.9",          # voice_style effects chain (GPL-3.0)
]
# Meta MMS-TTS voices (Tamil by default). Pulls in torch, so it's separate.
mms = [
    "transformers>=4.40",
    "torch>=2.2",
]
vision = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
]
desktop = [
    "pynput>=1.7.6",
]
# CUDA 12 libraries that faster-whisper (CTranslate2) needs on Windows.
# Installing them with pip avoids a manual CUDA/cuDNN install.
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
