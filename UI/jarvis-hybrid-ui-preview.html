  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;jarvis-hybrid-ui&#x27;);
      if (!root) return;
      const shell = root.querySelector(&#x27;.jh-shell&#x27;);
      const navButtons = [...root.querySelectorAll(&#x27;[data-view-target]&#x27;)];
      const views = [...root.querySelectorAll(&#x27;[data-view]&#x27;)];
      const saved = window.openai?.widgetState?.privateContent;

      const voiceStates = [
        { key: &#x27;ready&#x27;, title: &#x27;Ready when you are&#x27;, detail: &#x27;Press the core or use your push-to-talk key&#x27;, orb: &#x27;Talk&#x27; },
        { key: &#x27;listening&#x27;, title: &#x27;I’m listening&#x27;, detail: &#x27;Speak naturally · press the core again when finished&#x27;, orb: &#x27;Listening&#x27; },
        { key: &#x27;thinking&#x27;, title: &#x27;Thinking&#x27;, detail: &#x27;Understanding the request and choosing the best route&#x27;, orb: &#x27;Working&#x27; },
        { key: &#x27;speaking&#x27;, title: &#x27;Speaking&#x27;, detail: &#x27;Streaming sentences through the local voice engine&#x27;, orb: &#x27;Stop&#x27; }
      ];

      const ui = {
        view: [&#x27;home&#x27;, &#x27;chat&#x27;, &#x27;memory&#x27;, &#x27;system&#x27;].includes(saved?.view) ? saved.view : &#x27;home&#x27;,
        voiceIndex: Number.isInteger(saved?.voiceIndex) ? saved.voiceIndex % voiceStates.length : 0,
        muted: Boolean(saved?.muted),
        memoryNode: [&#x27;core&#x27;, &#x27;study&#x27;, &#x27;jarvis&#x27;, &#x27;language&#x27;].includes(saved?.memoryNode) ? saved.memoryNode : &#x27;core&#x27;
      };

      const memoryCopy = {
        core: [&#x27;Profile&#x27;, &#x27;High-level preferences and identity facts explicitly remembered by the user.&#x27;],
        study: [&#x27;Study&#x27;, &#x27;University subjects, revision topics, and the current study plan.&#x27;],
        jarvis: [&#x27;Jarvis project&#x27;, &#x27;Voice, routing, model, and interface decisions connected to this assistant.&#x27;],
        language: [&#x27;Languages&#x27;, &#x27;English, Sinhala, and Tamil preferences used for recognition and speech.&#x27;]
      };

      function persist() {
        if (!window.openai?.setWidgetState) return;
        window.openai.setWidgetState({
          modelContent: { selectedJarvisView: ui.view, voiceState: voiceStates[ui.voiceIndex].key, muted: ui.muted },
          privateContent: ui
        }).catch(() =&gt; {});
      }

      function render() {
        const voice = voiceStates[ui.voiceIndex];
        shell.dataset.voiceState = voice.key;
        navButtons.forEach(button =&gt; button.setAttribute(&#x27;aria-selected&#x27;, button.dataset.viewTarget === ui.view ? &#x27;true&#x27; : &#x27;false&#x27;));
        views.forEach(view =&gt; { view.hidden = view.dataset.view !== ui.view; });
        root.querySelectorAll(&#x27;[data-state-title]&#x27;).forEach(el =&gt; { el.textContent = voice.title; });
        root.querySelectorAll(&#x27;[data-state-detail]&#x27;).forEach(el =&gt; { el.textContent = voice.detail; });
        root.querySelectorAll(&#x27;[data-orb-state]&#x27;).forEach(el =&gt; { el.textContent = voice.orb; });
        root.querySelectorAll(&#x27;[data-mute]&#x27;).forEach(button =&gt; {
          button.setAttribute(&#x27;aria-pressed&#x27;, ui.muted ? &#x27;true&#x27; : &#x27;false&#x27;);
          button.setAttribute(&#x27;aria-label&#x27;, ui.muted ? &#x27;Unmute Friday&#x27; : &#x27;Mute Friday&#x27;);
        });
        root.querySelectorAll(&#x27;[data-memory-key]&#x27;).forEach(button =&gt; {
          button.setAttribute(&#x27;aria-pressed&#x27;, button.dataset.memoryKey === ui.memoryNode ? &#x27;true&#x27; : &#x27;false&#x27;);
        });
        const memoryText = memoryCopy[ui.memoryNode];
        root.querySelectorAll(&#x27;[data-memory-title]&#x27;).forEach(el =&gt; { el.textContent = memoryText[0]; });
        root.querySelectorAll(&#x27;[data-memory-detail]&#x27;).forEach(el =&gt; { el.textContent = memoryText[1]; });
        root.querySelectorAll(&#x27;[data-graph-node]&#x27;).forEach(node =&gt; {
          const selected = node.dataset.graphNode === ui.memoryNode;
          node.classList.toggle(&#x27;is-selected&#x27;, selected);
          node.classList.toggle(&#x27;is-dimmed&#x27;, !selected);
        });
      }

      navButtons.forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          ui.view = button.dataset.viewTarget;
          render();
          persist();
        });
      });

      root.querySelectorAll(&#x27;[data-voice-cycle]&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          ui.voiceIndex = (ui.voiceIndex + 1) % voiceStates.length;
          render();
          persist();
        });
      });

      root.querySelectorAll(&#x27;[data-mute]&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          ui.muted = !ui.muted;
          render();
          persist();
        });
      });

      root.querySelectorAll(&#x27;[data-memory-key]&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          ui.memoryNode = button.dataset.memoryKey;
          render();
          persist();
        });
      });

      const design = { accent: &#x27;#ff8a1f&#x27;, orbSize: 270, glow: 64, showHomeDiagnostics: true };
      function renderDesign() {
        shell.style.setProperty(&#x27;--jh-accent&#x27;, design.accent);
        shell.style.setProperty(&#x27;--jh-orb-size&#x27;, `${design.orbSize}px`);
        shell.style.setProperty(&#x27;--jh-glow&#x27;, `${design.glow}%`);
        shell.dataset.homeDiagnostics = design.showHomeDiagnostics ? &#x27;true&#x27; : &#x27;false&#x27;;
        root.querySelectorAll(&#x27;[data-home-diagnostics]&#x27;).forEach(el =&gt; { el.hidden = !design.showHomeDiagnostics; });
      }
      renderDesign();

      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: shell, onChange: renderDesign });
        tweak.addColorPicker(design, &#x27;accent&#x27;, { label: &#x27;Core accent&#x27;, reference: &#x27;--jh-accent&#x27; });
        tweak.addSlider(design, &#x27;orbSize&#x27;, { label: &#x27;Core size&#x27;, min: 190, max: 330, unit: &#x27;px&#x27;, reference: &#x27;--jh-orb-size&#x27; });
        tweak.addSlider(design, &#x27;glow&#x27;, { label: &#x27;Core energy&#x27;, min: 25, max: 85, unit: &#x27;%&#x27;, reference: &#x27;--jh-glow&#x27; });
        tweak.addToggle(design, &#x27;showHomeDiagnostics&#x27;, { label: &#x27;Show status panel&#x27;, reference: &#x27;home.diagnostics&#x27; });
      }

      window.addEventListener(&#x27;openai:set_globals&#x27;, event =&gt; {
        const next = event.detail?.globals?.widgetState?.privateContent;
        if (!next) return;
        if ([&#x27;home&#x27;, &#x27;chat&#x27;, &#x27;memory&#x27;, &#x27;system&#x27;].includes(next.view)) ui.view = next.view;
        if (Number.isInteger(next.voiceIndex)) ui.voiceIndex = next.voiceIndex % voiceStates.length;
        ui.muted = Boolean(next.muted);
        if ([&#x27;core&#x27;, &#x27;study&#x27;, &#x27;jarvis&#x27;, &#x27;language&#x27;].includes(next.memoryNode)) ui.memoryNode = next.memoryNode;
        render();
      });

      render();
    })();
  &lt;/script&gt;

    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
