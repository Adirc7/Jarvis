          button.style.setProperty(&quot;--ju-node-size&quot;, node.size + &quot;px&quot;);
          button.style.setProperty(&quot;--ju-node-color&quot;, memoryGraphColors[node.memory]);
          if (node.major || node.show) {
            const label = document.createElement(&quot;span&quot;);
            label.className = &quot;ju-memory-node-label&quot;;
            label.textContent = node.label;
            button.appendChild(label);
          }
          memoryGraph.appendChild(button);
          memoryGraphNodeElements.set(node.id, button);
        });

        renderMemoryProjection();
      }

      function memoryNodeDepth(node) {
        let hash = 0;
        for (let index = 0; index &lt; node.id.length; index += 1) {
          hash = (hash * 31 + node.id.charCodeAt(index)) &gt;&gt;&gt; 0;
        }
        const variation = node.major ? 0 : ((hash % 11) - 5) * 14;
        return memoryDepthBase[node.memory] + variation;
      }

      function projectMemoryNode(node) {
        const yaw = state.memoryYaw * Math.PI / 180;
        const pitch = state.memoryPitch * Math.PI / 180;
        const sourceX = (node.x - 50) * 10;
        const sourceY = (node.y - 50) * 6;
        const sourceZ = memoryNodeDepth(node);

        const yawX = sourceX * Math.cos(yaw) + sourceZ * Math.sin(yaw);
        const yawZ = -sourceX * Math.sin(yaw) + sourceZ * Math.cos(yaw);
        const pitchY = sourceY * Math.cos(pitch) - yawZ * Math.sin(pitch);
        const pitchZ = sourceY * Math.sin(pitch) + yawZ * Math.cos(pitch);
        const perspective = 1150 / (1150 - pitchZ);
        const viewScale = perspective * state.memoryZoom;

        return {
          x: 500 + yawX * viewScale,
          y: 300 + pitchY * viewScale,
          depth: pitchZ,
          scale: Math.max(.62, Math.min(1.42, viewScale))
        };
      }

      function formatMemoryAngle(value) {
        const rounded = Math.round(value);
        return (rounded &lt; 0 ? &quot;−&quot; : &quot;&quot;) + Math.abs(rounded) + &quot;°&quot;;
      }

      function renderMemoryProjection() {
        if (!memoryGraph || !memoryLinks) return;
        const projected = new Map();

        memoryGraphNodes.forEach(node =&gt; {
          const point = projectMemoryNode(node);
          projected.set(node.id, point);
          const button = memoryGraphNodeElements.get(node.id);
          if (!button) return;
          button.style.left = (point.x / 10).toFixed(3) + &quot;%&quot;;
          button.style.top = (point.y / 6).toFixed(3) + &quot;%&quot;;
          button.style.setProperty(&quot;--ju-node-depth-scale&quot;, point.scale.toFixed(3));
          button.style.opacity = String(Math.max(.5, Math.min(1, .74 + point.depth / 620)));
          button.style.zIndex = String(4 + Math.round((point.depth + 240) / 24));
        });

        memoryGraphEdges.forEach(edge =&gt; {
          const from = projected.get(edge.from.id);
          const to = projected.get(edge.to.id);
          if (!from || !to) return;
          edge.line.setAttribute(&quot;x1&quot;, from.x.toFixed(2));
          edge.line.setAttribute(&quot;y1&quot;, from.y.toFixed(2));
          edge.line.setAttribute(&quot;x2&quot;, to.x.toFixed(2));
          edge.line.setAttribute(&quot;y2&quot;, to.y.toFixed(2));
          const edgeDepth = (from.depth + to.depth) / 2;
          edge.line.style.opacity = String(Math.max(.28, Math.min(.88, .5 + edgeDepth / 620)));
        });

        setText(
          &quot;[data-memory-angle]&quot;,
          &quot;Y &quot; + formatMemoryAngle(state.memoryYaw) + &quot; · X &quot; + formatMemoryAngle(state.memoryPitch) + &quot; · &quot; + Math.round(state.memoryZoom * 100) + &quot;%&quot;
        );
      }

      function requestMemoryProjection() {
        if (memoryOrbit.frame) return;
        memoryOrbit.frame = requestAnimationFrame(() =&gt; {

      function normalizeMemoryYaw(value) {
        return ((value + 180) % 360 + 360) % 360 - 180;

        state.memoryYaw = -8;

      function finishMemoryOrbit(event) {
        if (!memoryGraph || memoryOrbit.pointerId === null || (event.pointerId !== undefined &amp;&amp; event.pointerId !== memoryOrbit.pointerId)) return;
        const activePointer = memoryOrbit.pointerId;
        const wasDragging = memoryOrbit.dragging;
        memoryOrbit.pointerId = null;
        memoryOrbit.dragging = false;
        memoryGraph.dataset.orbiting = &quot;false&quot;;
        if (memoryGraph.hasPointerCapture &amp;&amp; memoryGraph.hasPointerCapture(activePointer)) {
          memoryGraph.releasePointerCapture(activePointer);
        }
        if (wasDragging) {
          memoryOrbit.suppressClick = true;
          clearTimeout(memoryOrbit.suppressTimer);
          memoryOrbit.suppressTimer = setTimeout(() =&gt; { memoryOrbit.suppressClick = false; }, 320);
          persist();
          announce(&quot;Memory view rotated to yaw &quot; + Math.round(state.memoryYaw) + &quot; degrees and pitch &quot; + Math.round(state.memoryPitch) + &quot; degrees&quot;);
        }
      }

      if (memoryGraph) {
        memoryGraph.dataset.orbiting = &quot;false&quot;;
        memoryGraph.addEventListener(&quot;pointerdown&quot;, event =&gt; {
          if (event.button !== 0 || memoryOrbit.pointerId !== null) return;
          memoryOrbit.pointerId = event.pointerId;
          memoryOrbit.startX = event.clientX;
          memoryOrbit.startY = event.clientY;
          memoryOrbit.lastX = event.clientX;
          memoryOrbit.lastY = event.clientY;
          memoryOrbit.dragging = false;
        });

        memoryGraph.addEventListener(&quot;pointermove&quot;, event =&gt; {
          if (event.pointerId !== memoryOrbit.pointerId) return;
          const distance = Math.hypot(event.clientX - memoryOrbit.startX, event.clientY - memoryOrbit.startY);
          if (!memoryOrbit.dragging &amp;&amp; distance &lt; 6) return;
          if (!memoryOrbit.dragging) {
            memoryOrbit.dragging = true;
            memoryGraph.dataset.orbiting = &quot;true&quot;;
            memoryGraph.setPointerCapture(event.pointerId);
          }
          const deltaX = event.clientX - memoryOrbit.lastX;
          const deltaY = event.clientY - memoryOrbit.lastY;
          memoryOrbit.lastX = event.clientX;
          memoryOrbit.lastY = event.clientY;
          state.memoryYaw = normalizeMemoryYaw(state.memoryYaw + deltaX * .34);

        memoryGraph.addEventListener(&quot;pointercancel&quot;, finishMemoryOrbit);
        memoryGraph.addEventListener(&quot;lostpointercapture&quot;, finishMemoryOrbit);
        window.addEventListener(&quot;pointerup&quot;, finishMemoryOrbit);

          else if (event.key === &quot;ArrowUp&quot;) state.memoryPitch = Math.min(72, state.memoryPitch + orbitStep);
          else if (event.key === &quot;ArrowDown&quot;) state.memoryPitch = Math.max(-72, state.memoryPitch - orbitStep);
          else if (event.key === &quot;+&quot; || event.key === &quot;=&quot;) state.memoryZoom = Math.min(1.42, state.memoryZoom + .06);
          else if (event.key === &quot;-&quot; || event.key === &quot;_&quot;) state.memoryZoom = Math.max(.68, state.memoryZoom - .06);
          else if (event.key === &quot;0&quot; || event.key === &quot;Home&quot;) resetMemoryView(false);

          if (!changed) return;
          event.preventDefault();
          event.stopPropagation();
          requestMemoryProjection();
          persist();
        });

        setText(&quot;[data-camera-label]&quot;, state.camera ? &quot;ACTIVE&quot; : &quot;OFF&quot;);

        setText(&quot;[data-context-summary]&quot;, contextCopy[state.view][1]);
        setText(&quot;[data-power-toggle]&quot;, state.power === &quot;awake&quot; ? &quot;Sleep&quot; : &quot;Wake&quot;);
        setText(&quot;[data-core-status]&quot;, state.power === &quot;awake&quot; ? &quot;VOICE CORE · VERIFIED SLICE&quot; : &quot;VOICE CORE · &quot; + lifecycle);
        const commandInput = root.querySelector(&quot;[data-command-input]&quot;);
        commandInput.placeholder = state.persona === &quot;friday&quot; ? &quot;Fridayගෙන් අහන්න…&quot; : &quot;Ask Jarvis…&quot;;
        root.querySelector(&quot;[data-mic-button]&quot;).setAttribute(&quot;aria-pressed&quot;, String(state.mic));
        root.querySelector(&quot;[data-mic-button]&quot;).disabled = state.power !== &quot;awake&quot;;
        root.querySelector(&quot;[data-focus-toggle]&quot;).setAttribute(&quot;aria-pressed&quot;, String(state.focus));

        const trackingDot = root.querySelector(&quot;[data-tracking-dot]&quot;);

        root.querySelectorAll(&quot;[data-control]&quot;).forEach(button =&gt; {
          const key = button.dataset.control;
          button.setAttribute(&quot;aria-pressed&quot;, String(Boolean(state[key])));
          button.disabled = button.dataset.planned === &quot;true&quot; || (state.power !== &quot;awake&quot; &amp;&amp; key !== &quot;clap&quot;);
        });
        root.querySelectorAll(&quot;[data-pointer-mode]&quot;).forEach(button =&gt; {

        });
        root.querySelectorAll(&quot;[data-quick]&quot;).forEach(button =&gt; {
          button.disabled = state.power !== &quot;awake&quot;;
        });
        root.querySelector(&quot;[data-sound-toggle]&quot;).setAttribute(&quot;aria-pressed&quot;, String(state.sound));

        root.querySelectorAll(&quot;[data-memory]&quot;).forEach(node =&gt; {
          node.setAttribute(&quot;aria-pressed&quot;, String(node.dataset.memory === state.memory));
        });
        if (memoryCopy[state.memory]) {
          setText(&quot;[data-memory-title]&quot;, memoryCopy[state.memory][0]);
          setText(&quot;[data-memory-description]&quot;, memoryCopy[state.memory][1]);
        }
        if (state.view === &quot;memory&quot;) requestMemoryProjection();
        root.querySelectorAll(&quot;[data-stage]&quot;).forEach(stage =&gt; {
          stage.setAttribute(&quot;aria-selected&quot;, String(stage.dataset.stage === state.stage));

        }
        const countrySelect = root.querySelector(&quot;[data-country-select]&quot;);

        const safetyText = &quot;Voice may cancel a turn. Broad gesture control, native approval, and OS actions remain planned capabilities.&quot;;
        setText(&quot;[data-safety-note]&quot;, safetyText);
        if (state.view === &quot;core&quot;) requestCoreConnectorLayout();
      }

      function setView(view, save = true) {
        if (!views.includes(view)) return;
        state.view = view;
        render();
        if (view === &quot;news&quot;) initMap();
        if (save) persist();
        announce(contextCopy[view][0] + &quot; opened&quot;);
      }

      function setCaption(text, speaker) {
        setText(&quot;[data-caption]&quot;, text);
        if (speaker) setText(&quot;[data-caption-speaker]&quot;, speaker);
      }

      function cycleVoice() {
        if (state.power !== &quot;awake&quot;) return;
        const index = voiceStates.indexOf(state.voice);
        state.voice = voiceStates[(index + 1) % voiceStates.length];
        if (state.voice === &quot;speaking&quot;) lastSpeakingAt = Date.now();
        const messages = {
          ready: &quot;All channels have returned to standby.&quot;,
          listening: &quot;Listening. Manual input remains available.&quot;,
          thinking: &quot;Processing the request through the safety-aware route.&quot;,
          speaking: state.persona === &quot;friday&quot;
            ? &quot;ඔබගේ ඉල්ලීම සම්පූර්ණයි. ප්‍රතිඵලය තහවුරු කර ඇත.&quot;
            : &quot;The request is complete, sir. The result has been verified.&quot;
        };
        setCaption(messages[state.voice]);
        render();
        persist();
        announce(&quot;Assistant state: &quot; + state.voice);
      }

      function togglePower(source) {
        state.power = state.power === &quot;awake&quot; ? &quot;sleeping&quot; : &quot;awake&quot;;
        state.voice = &quot;ready&quot;;
        if (state.power === &quot;sleeping&quot;) {
          state.mic = false;
          state.camera = false;
          state.gesture = false;
          state.mouse = false;
          setCaption(state.clap ? &quot;Sleeping with the optional clap listener armed.&quot; : &quot;Privacy sleep. All sensors are off.&quot;);
          announce(&quot;Jarvis is sleeping&quot;);
        } else {
          const hour = new Date().getHours();
          const period = hour &lt; 12 ? &quot;morning&quot; : (hour &lt; 18 ? &quot;afternoon&quot; : &quot;evening&quot;);
          const greeting = state.persona === &quot;friday&quot;
            ? &quot;සුභ දවසක්. Friday සූදානම්.&quot;
            : &quot;Good &quot; + period + &quot;, sir. How may I help you?&quot;;
          setCaption(greeting);
          speak(greeting);
          announce(&quot;Jarvis woke through &quot; + source);
        }
        render();
        persist();
      }

      function killControl() {
        state.mic = false;
        state.clap = false;
        state.mouse = false;
        state.gesture = false;
        state.camera = false;
        state.voice = &quot;ready&quot;;
        state.pointerMode = &quot;PAUSED&quot;;
        if (&quot;speechSynthesis&quot; in window) window.speechSynthesis.cancel();
        const openConfirm = root.querySelector(&quot;[data-confirm-dialog]&quot;);
        const openSettings = root.querySelector(&quot;[data-settings-dialog]&quot;);
        if (openConfirm &amp;&amp; openConfirm.open) openConfirm.close();
        if (openSettings &amp;&amp; openSettings.open) openSettings.close();
        setCaption(&quot;All preview sensor controls and speech stopped. Manual input remains available.&quot;);
        setText(&quot;[data-current-operation]&quot;, &quot;Cancelled by Ctrl+Alt+K&quot;);
        setText(&quot;[data-action-detail]&quot;, &quot;No preview tool is running. Production uses a native global stop hotkey.&quot;);
        render();
        persist();
        announce(&quot;Emergency stop completed&quot;);

      root.querySelectorAll(&quot;[data-view]&quot;).forEach(button =&gt; {

      root.querySelector(&quot;[data-persona-toggle]&quot;).addEventListener(&quot;click&quot;, () =&gt; {

      root.querySelectorAll(&quot;[data-channel]&quot;).forEach(button =&gt; {

        });

      root.querySelector(&quot;[data-simulate-clap]&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        if (!state.clap) {
          setCaption(&quot;Double-clap listening is disabled. Use the manual power control.&quot;);

          return;
        }
        if (state.power === &quot;sleeping&quot;) {
          togglePower(&quot;simulated double clap&quot;);
        } else if (state.voice === &quot;speaking&quot; || Date.now() - lastSpeakingAt &lt; 500) {
          setCaption(&quot;Simulated double clap ignored while Jarvis is speaking and for 0.5 seconds afterward.&quot;);
          announce(&quot;Double clap ignored during speech suppression window&quot;);
        } else {
          state.mic = true;
          state.voice = &quot;listening&quot;;
          setCaption(&quot;Yes, sir? Simulated double clap starts listening while Jarvis is awake and quiet.&quot;);

          persist();
          announce(&quot;Double clap preview started listening&quot;);

      });

      root.querySelectorAll(&quot;[data-control]&quot;).forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          const control = button.dataset.control;
          if (state.power !== &quot;awake&quot; &amp;&amp; control !== &quot;clap&quot;) {
            setCaption(&quot;Wake Jarvis before enabling camera, gestures, or virtual mouse control.&quot;);
            announce(control + &quot; remains off while sleeping&quot;);
            return;
          }
          if (control === &quot;clap&quot;) state.clap = !state.clap;
          if (control === &quot;camera&quot;) {
            state.camera = !state.camera;
            if (!state.camera) {
              state.gesture = false;
              state.mouse = false;
            }
          }
          if (control === &quot;gesture&quot;) {
            state.gesture = !state.gesture;
            if (state.gesture) {

              state.mouse = false;
            }
          }
          if (control === &quot;mouse&quot;) {

      root.querySelectorAll(&quot;[data-pointer-mode]&quot;).forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {

          announce(&quot;Pointer mode: &quot; + state.pointerMode);

      const cameraFrame = root.querySelector(&quot;[data-camera-frame]&quot;);
      cameraFrame.addEventListener(&quot;pointermove&quot;, event =&gt; {
        if (!state.mouse) return;
        const rect = cameraFrame.getBoundingClientRect();
        const x = Math.max(.15, Math.min(.85, (event.clientX - rect.left) / rect.width));
        const y = Math.max(.15, Math.min(.85, (event.clientY - rect.top) / rect.height));
        const mappedX = (x - .15) / .7;
        const mappedY = (y - .15) / .7;
        const cursor = root.querySelector(&quot;[data-virtual-cursor]&quot;);
        cursor.style.left = (15 + mappedX * 70) + &quot;%&quot;;
        cursor.style.top = (15 + mappedY * 70) + &quot;%&quot;;
        setText(&quot;[data-coordinate]&quot;, &quot;X &quot; + mappedX.toFixed(2) + &quot; · Y &quot; + mappedY.toFixed(2));
      });

      root.querySelectorAll(&quot;[data-memory]&quot;).forEach(button =&gt; {

      root.querySelectorAll(&quot;[data-stage]&quot;).forEach(button =&gt; {

          root.querySelectorAll(&quot;[data-stage]&quot;).forEach(stage =&gt; {
            stage.setAttribute(&quot;aria-selected&quot;, String(stage === button));

          setText(&quot;[data-stage-title]&quot;, state.stage);
          setText(&quot;[data-stage-detail]&quot;, stageCopy[state.stage]);

          announce(state.stage + &quot; stage selected&quot;);

      root.querySelectorAll(&quot;[data-quick]&quot;).forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          if (state.power !== &quot;awake&quot;) {
            setCaption(&quot;Wake Jarvis before starting a command.&quot;);
            announce(&quot;Command blocked while sleeping&quot;);
            return;
          }
          const command = button.dataset.quick;
          setText(&quot;[data-current-operation]&quot;, command);
          setText(&quot;[data-action-detail]&quot;, &quot;The semantic tool route is preferred before pointer simulation.&quot;);
          setCaption(&quot;Starting: &quot; + command + &quot;. I will report the verified result.&quot;);
          state.voice = &quot;thinking&quot;;
          render();
          persist();
          announce(command + &quot; started&quot;);
        });

      root.querySelector(&quot;[data-power-toggle]&quot;).addEventListener(&quot;click&quot;, () =&gt; togglePower(&quot;manual control&quot;));
      root.querySelector(&quot;[data-privacy]&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        state.power = &quot;sleeping&quot;;
        state.mic = false;
        state.clap = false;
        state.camera = false;
        state.gesture = false;
        state.mouse = false;
        state.voice = &quot;ready&quot;;
        setCaption(&quot;Privacy sleep enabled. Microphone and camera are off.&quot;);
        render();
        persist();
        announce(&quot;Privacy sleep enabled&quot;);
      });

      root.querySelectorAll(&quot;[data-kill-switch]&quot;).forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, killControl);
      });

      root.querySelector(&quot;[data-sound-toggle]&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        state.sound = !state.sound;
        render();
        persist();
        announce(&quot;Preview speech &quot; + (state.sound ? &quot;enabled&quot; : &quot;disabled&quot;));
      });

      root.querySelector(&quot;[data-sensor-shortcut]&quot;).addEventListener(&quot;click&quot;, () =&gt; setView(&quot;controls&quot;));

      const confirmDialog = root.querySelector(&quot;[data-confirm-dialog]&quot;);
      root.querySelectorAll(&quot;[data-open-confirm]&quot;).forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          mouseWasActiveBeforeDialog = state.mouse;
          state.mouse = false;
          state.pointerMode = &quot;PAUSED&quot;;
          render();
          confirmDialog.showModal();
          announce(&quot;Ask-first confirmation opened; virtual mouse paused&quot;);
        });
      });
      root.querySelector(&quot;[data-confirm-cancel]&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        confirmDialog.close();
        setCaption(&quot;Preview cancelled. No filesystem action was connected and no files changed.&quot;);
        announce(&quot;Risky action cancelled&quot;);
      });
      root.querySelector(&quot;[data-confirm-simulation]&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        confirmDialog.close();
        setCaption(&quot;Preview only: the native bridge acknowledgement was simulated. Production never trusts a DOM click for this decision.&quot;);
        setText(&quot;[data-current-operation]&quot;, &quot;Moving files to recovery&quot;);
        announce(&quot;Native bridge acknowledgement previewed&quot;);
      });
      confirmDialog.addEventListener(&quot;close&quot;, () =&gt; {
        if (mouseWasActiveBeforeDialog) {
          setText(&quot;[data-action-detail]&quot;, &quot;Virtual mouse remains paused after confirmation. Re-arm it explicitly.&quot;);
        }

        persist();

      confirmDialog.addEventListener(&quot;cancel&quot;, () =&gt; {

        announce(&quot;Ask-first preview cancelled&quot;);

      const settingsDialog = root.querySelector(&quot;[data-settings-dialog]&quot;);

        state.voice = &quot;thinking&quot;;
        setText(&quot;[data-current-operation]&quot;, command);
        setCaption(&quot;Understood. I am routing that request through the safety gate.&quot;);
        setText(&quot;[data-action-detail]&quot;, &quot;Request captured from the manual channel. No direct action bypasses policy.&quot;);
        input.value = &quot;&quot;;
        render();
        persist();
        announce(&quot;Command submitted&quot;);
      });

      root.querySelector(&quot;[data-study-next]&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        setCaption(&quot;The final check differentiates the proposed solution and substitutes it back into the original equation.&quot;);
        announce(&quot;Next study explanation shown&quot;);

      const WORLD_MAP_VIEWBOX = &quot;0 0 960 500&quot;;

      function setWorldMapView(shouldAnnounce = true) {
        const map = root.querySelector(&quot;[data-world-map]&quot;);
        if (!map) return;
        map.setAttribute(&quot;viewBox&quot;, WORLD_MAP_VIEWBOX);
        const name = countryNames[state.country] || &quot;Country&quot;;
        setText(&quot;[data-map-focus-label]&quot;, &quot;Full world · &quot; + name + &quot; selected&quot;);
        if (shouldAnnounce) announce(&quot;World map reset; &quot; + name + &quot; remains selected&quot;);
      }

      function focusMapCountry(country) {
        const map = root.querySelector(&quot;[data-world-map]&quot;);
        if (!map || !country || typeof country.getBBox !== &quot;function&quot;) return;
        const bounds = country.getBBox();
        if (!Number.isFinite(bounds.x) || bounds.width &lt;= 0 || bounds.height &lt;= 0) return;
        const mapAspect = 960 / 500;
        const padding = Math.max(10, Math.max(bounds.width, bounds.height) * .42);
        let width = Math.max(120, bounds.width + padding * 2);
        let height = Math.max(70, bounds.height + padding * 2);
        if (width / height &lt; mapAspect) width = height * mapAspect;
        else height = width / mapAspect;
        const x = bounds.x + bounds.width / 2 - width / 2;
        const y = bounds.y + bounds.height / 2 - height / 2;
        map.setAttribute(&quot;viewBox&quot;, [x, y, width, height].map(value =&gt; value.toFixed(2)).join(&quot; &quot;));
        setText(&quot;[data-map-focus-label]&quot;, country.dataset.mapCountryName + &quot; focus · World view resets&quot;);
