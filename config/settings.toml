# Jarvis settings. Values here are defaults; change them freely.

[general]
default_language = "en"        # a key from config/languages.toml
# "fixed": Jarvis keeps one language until you tell it to switch (recommended).
# "auto":  Jarvis follows the language Whisper detects in each utterance.
#          Experimental: detection on short commands is unreliable.
language_mode = "fixed"
# Small files Jarvis keeps between runs (e.g. when you last talked). Not committed.
state_dir = "state"

[greeting]
# Jarvis greets like a person: a full greeting the first time each day, a
# short "welcome back" after a break, and nothing extra within the same
# session. The lines are in config/languages.toml under [<code>.greetings].
enabled = true
same_session_minutes = 15     # talk again within this time = same session (10-20 feels natural)

[hotkeys]
# pynput hotkey syntax. These work from any app.
kill_switch = "<ctrl>+<alt>+k"
mute = "<ctrl>+<alt>+m"         # voice replies on/off (text still prints)
# Hold this single key to talk, release to send. Key names come from pynput:
# "ctrl_r" (right Ctrl), "alt_r", "f9", or one character such as "`".
push_to_talk = "ctrl_r"

[latency]
# Target from speech end to the first audio of the reply, for simple questions.
target_first_audio_ms = 1500

[audio]
sample_rate = 16000             # what Whisper expects
input_device = ""               # empty = Windows default microphone
output_device = ""              # empty = Windows default speakers
min_utterance_s = 0.35          # shorter key taps are ignored
max_utterance_s = 30

[stt]
model = "small"                 # multilingual; compare with "large-v3-turbo"
device = "cuda"                 # falls back to "cpu" if CUDA isn't available
compute_type = "int8_float16"   # use "int8" on CPU
vad_filter = true
beam_size = 1                   # 1 is fastest; 5 is a little more accurate
# Words Whisper should expect (names, apps). Listing the languages helps it
# hear "Sinhala" instead of "singular".
initial_prompt = "Jarvis. Sinhala, English, Tamil."
# Check which language was spoken before transcribing (one extra encoder pass).
detect_language = true
# If Whisper hears a different language than the current one with at least this
# probability, Jarvis re-transcribes in that language before checking for a
# switch command. This is how "switch to English" still works in Sinhala mode.
retranscribe_threshold = 0.80
# Whisper small guesses Sinhala as Malayalam, Hindi, Bengali... (3 Nov). Only
# Jarvis's languages are possible, so a guess outside them becomes the likeliest
# of them, with its share of them as the probability above.
only_my_languages = true
# When a transcript looks wrong, Whisper tries again at these "temperatures"
# (more randomness each time). Its default is six tries, which took 6.5-7 s on
# Sinhala it can't write (21 Oct); two tries is enough for the nonsense check.
temperatures = [0.0, 0.4]
# Ask again instead of answering when the transcript looks like nonsense
# (src/jarvis/voice/clarity.py): mostly repeats, letters from the wrong
# alphabet, or Whisper mostly guessing.
reject_unclear = true
unclear_max_compression = 2.4       # Whisper's own repetition limit
unclear_min_logprob = -1.0          # Whisper's own "guessing" limit
unclear_max_foreign_script = 0.2    # share of letters from other alphabets

# Per language (falls back to initial_prompt): the places and names Whisper
# should expect. On 30 Oct "Kaduwela" was heard as "Cardwell". Keep each short
# (Whisper reads at most about 220 tokens of it).
[stt.prompts]
en = "Jarvis, Friday. Kaduwela, Malabe, Kelaniya, Kadawatha, Maharagama, Nugegoda, Colombo, Kandy, Galle, Jaffna, Trincomalee, Batticaloa, Anuradhapura, Kurunegala, Ratnapura, Nuwara Eliya, Badulla, Hambantota, SLIIT, Sri Lanka. Sinhala, English, Tamil. Groq, Ollama, Gemini, OpenRouter."

[tts]
kokoro_model = "models/kokoro-v1.0.onnx"
kokoro_voices = "models/voices-v1.0.bin"
piper_dir = "models/piper"
speed = 1.0                     # 0.9 = slower and calmer
# Where Kokoro (English) runs: "auto" = the NVIDIA GPU if there is one, else
# the CPU; or "cuda" / "cpu". GPU: 0.18 s for a 42-character sentence on the
# laptop, CPU: 0.77 s. Piper (Sinhala) is fast enough on the CPU.
device = "auto"
# Start speaking as soon as the first short sentence is ready.
first_chunk_min_chars = 12
# A longer first sentence is cut at its first comma, so the voice starts sooner
# (Kokoro needs about 0.2 s plus 14 ms per character on the laptop's CPU).
first_chunk_max_chars = 60
# Lighter on graphics memory: no exhaustive convolution search, no maximum
# workspace (a "Memory allocation failure" on 22 Oct stopped the voice). If
# the GPU still fails, the voice moves to the CPU by itself.
cuda_memory_saver = true
chunk_min_chars = 40
chunk_max_chars = 220
# Say a short filler ("Mm, one moment") if the LLM hasn't sent any text this
# long after the request. Once text arrives, the real voice is close, and a
# filler would only delay it. Once per turn at most.
fillers = true
filler_after_ms = 1200           # was 700; replies now usually start by 1.4 s (21 Oct)
# Fillers longer than this are skipped (if none is short enough, the shortest
# is kept), because the real reply has to wait until the filler ends.
filler_max_ms = 700

# The "Jarvis feel": a light studio chain applied to every reply.
# Set enabled = false to hear the raw voice.
[voice_style]
enabled = true
highpass_hz = 90                # remove rumble
low_shelf_db = 2.0              # a little more chest (below 250 Hz)
presence_db = 2.5               # clarity around 3 kHz
air_db = 2.0                    # crisp top end above 9 kHz
compressor_threshold_db = -20
compressor_ratio = 3.0          # even, controlled loudness
chorus_mix = 0.08               # faint synthetic shimmer; 0 = off
reverb_room = 0.14              # small, clean room
reverb_wet = 0.10
output_gain_db = 0.0
target_rms_db = -20.0           # same loudness for every voice and language

[vision]
camera_index = 0
num_hands = 1
hand_model = "models/hand_landmarker.task"
gesture_model = "models/gesture_recognizer.task"   # palm, thumbs (docs/IMPLEMENTATION_PLAN.md, M8)

[intents]
# Adhi's trained intent model (docs/TRAINING_INTENT.md). When this file
# exists, it decides the kind of request (and so which model answers) when
# it's at least min_confidence sure; otherwise the keyword rules decide.
model = "models/intent/intent.joblib"
min_confidence = 0.6

[window]
# Jarvis's window (src/jarvis/ui/): a live page at http://127.0.0.1:8765 that
# only this computer can open. The orb shows what Jarvis is doing (listening,
# thinking, speaking; gold for Jarvis, teal for Friday); beside it what you
# said and what Jarvis answered, its actions, timers, the latest news, and the
# news and weather maps. You can type to Jarvis in it.
enabled = true
port = 8765
open_on_start = true
# "app": a window of its own (Edge or Chrome in app mode: no tabs or address
# bar, Jarvis's icon); "browser": a tab in the default browser.
style = "app"
size = [1280, 820]
# Closing the window stops Jarvis, like any app (only with style = "app").
quit_when_closed = true

[explore]
# The 3D explorer's hand limits (docs/EXPLORE.md, "Tune it to your hand"). The side panel shows your
# "spread" (fingertips from the wrist, in hand sizes) and "pinch" (thumb tip to index tip): set open_fist
# a little above your fist's spread, open_flat a little below your open hand's, and pinch a little above
# your pinch's distance.
open_fist = 1.15
open_flat = 1.9
pinch = 0.33

[problems]
# Worked problems (docs/PROBLEMS.md). "I got 33.3": right when it's within this
# fraction of SymPy's answer (0.02 = 2%; 33.3 for 33.33 is right).
answer_tolerance = 0.02
# "Practice: new numbers": each given number is multiplied by a random factor
# in this range (constants like g stay), then everything is worked out again.
practice_spread = [0.6, 1.5]
# How many planned problems to keep in state/problems/ (to look at one that
# went wrong): the newest are kept.
keep_plans = 100

[clap]
# The double clap (decision D29; src/jarvis/perception/clap.py): two claps 0.2-0.6 s apart make Jarvis
# listen hands-free ("Yes, sir?"), until you pause. Ignored while he speaks and for 0.5 s after; it never
# confirms, cancels, sleeps or quits. Off by default: when on, the microphone is measured between key
# presses (nothing kept). /clap on or /clap off. Tune with scripts/clap_test.py on your own claps.
enabled = false
min_high_share = 0.3      # a clap's share of energy above 2 kHz; a desk tap or knock is lower
rise_db = 15.0            # how far above the room's noise a clap must be
min_gap_s = 0.2
max_gap_s = 0.6

[clap_launcher]
# Clap three times to open Jarvis when he isn't running (src/jarvis/clap_launcher.py): a small program with
# no window, started at sign-in by scripts\clap_launcher.cmd install. It uses the [clap] limits above and
# records nothing. false: it quits at once (or: scripts\clap_launcher.cmd uninstall).
enabled = true
max_gap_s = 0.9           # the most between two of the three claps (people clap three a little slower)

[gestures]
# Palm to pause (decision D29; docs/IMPLEMENTATION_PLAN.md, M8): a palm held
# still for half a second stops Jarvis talking, or plays or pauses a video
# Jarvis opened. Off by default: the camera is on only while this is true, or
# after /camera on. Nothing is recorded. Also used by scripts/gesture_preview.py
# and scripts/palm_report.py.
enabled = false
fps = 15             # camera pictures checked per second; plenty for a palm
hand = "right"
min_score = 0.6      # MediaPipe's open-palm score on the laptop: middle 0.63, so 0.7 missed most (24 Oct)
max_move = 0.35      # the palm must stay this still during the 0.5 s hold (share of its size); 0 = off
# Which way the points check thinks the palm faces. 1 is right once MediaPipe
# gets the unmirrored picture (25 Oct: on 24 Oct it got a mirrored one, swapped
# the hands, and -1 only made up for that). If the check says "back of hand"
# for your palm, put -1 in settings.local.toml.
facing_sign = 1

[tools]
# Bing and YouTube by voice (src/jarvis/tools/web.py): "open Bing", "search
# Bing for ...", "open YouTube", "play the second one", "stop the video",
# "go back". Only bing.com and youtube.com. YouTube titles need a free
# YOUTUBE_API_KEY in .env; without it Jarvis opens the results page.
web = true
# PC tools (src/jarvis/tools/desktop.py), every call through the safety gate
# (tools/gate.py): open a program from a fixed list, volume, screenshot,
# timer, notes, and moving a file to Jarvis's recycle folder (only after a
# click). Jarvis's files go in jarvis_folder (notes/, screenshots/,
# recycle/); it can't touch anything outside it and allowed_folders.
# Every action is written to logs/actions-YYYYMMDD.jsonl.
desktop = true
# News (GDELT worldwide, Sri Lankan RSS feeds, BBC), the world news map,
# Wikipedia, research papers (OpenAlex) and maths checked by SymPy
# (src/jarvis/tools/info.py, src/jarvis/knowledge/). The model answers from
# what they fetch, naming sources, then gives its own labelled take.
knowledge = true
jarvis_folder = "~/Documents/Jarvis"
allowed_folders = []
browser = "edge"            # "edge" (Microsoft Edge on Windows) or "default"
# Requests the fixed rules miss ("I'd rather hear the anime one") go to the
# model with the same actions as tools, and what's on screen (the videos
# Jarvis read out). It understands any wording; Jarvis's code does the action.
# "smart" (the default): the web and PC tools on every request (they're
# small, and understand any wording), the knowledge tools in groups (news,
# weather, research, maths, map) only when the request is about them, so it
# stays small: Groq's free tier allows 8,000 tokens a minute per model, and
# with every tool offered the second question in a minute hit the limit
# (30 Oct). "likely": the web and PC tools too only with a word for them;
# "always": every tool on every request; "off".
model_tools = "smart"
# "Where's my DWBI report?", "what's in it?" (knowledge/files.py): find_file and
# read_file look only in these folders, read-only, and never read secrets (.env,
# keys, password files). Add your project folders on D: in settings.local.toml,
# e.g. search_folders = ["~/Desktop", "~/Documents", "~/Downloads", "D:/"].
search_folders = ["~/Desktop", "~/Documents", "~/Downloads"]
# The world weather map (knowledge/world_weather.py) asks Open-Meteo for every
# country again only after this many minutes; until then it opens at once.
world_weather_minutes = 60
# MATLAB code the model writes (src/jarvis/tools/matlab.py): "solve this ODE in
# MATLAB and plot it". Offered when you mention MATLAB, Octave or a numerical
# solution; the code shows on the board and runs only after you click.
matlab = true

[matlab]
# "auto": MATLAB if it's installed (C: or D:, newest release), else GNU Octave
# (free, runs most MATLAB code); or "matlab" / "octave". path: the program file,
# if it isn't in the usual place (e.g. "D:/MATLAB/R2024b/bin/matlab.exe").
engine = "auto"
path = ""
# Seconds before a run is stopped (MATLAB itself takes 10-30 s to start).
timeout_s = 120
# Ask before every run (a click). false: runs without asking, still logged and
# still refusing code that reaches the system, files or the internet. Your call.
confirm = true

[empathy]
# The empathy learner (src/jarvis/empathy/, docs/TRAINING_EMPATHY.md). What you
# say right after a reply ("thanks", "too long", "be more direct", interrupting
# him, asking the same thing again) counts for that reply's mode, in
# state/empathy.json (counts only, never your words). The learner picks the
# mode from those counts: "fixed" (always the default mode in persona.toml)
# until yours exists, then "thompson" (src/jarvis/empathy/thompson.py).
learning = true
learner = "fixed"
# The modes the learner may use; say "be more direct" or /empathy <mode> any
# time (that one stays for the session). Distress always gets "supportive".
allowed = ["logical", "balanced", "supportive"]
# Choose again after feedback, or after this many replies, so the style
# doesn't change every turn.
rechoose_every = 5

[standin]
# Your stand-in model (src/jarvis/standin/, docs/TRAINING_STANDIN.md). When no language model can be
# reached, or none has started answering after after_s on a weak connection, it answers instead and says
# so. It learns from the questions you asked and the answers the models gave: only timeless ones (no news,
# weather, the time or PC actions), text only, kept in data/standin/pairs.jsonl on this computer.
save = false                # keep those pairs (off until you choose to)
answer = true               # answer from them when the models can't
after_s = 6.0               # a weak connection: no first word after this long, and a close match: it answers
encoder = "intfloat/multilingual-e5-small"   # "tfidf": the fallback, no download
# Training your student on Kaggle's free GPU (scripts/train_standin.py; KAGGLE_API_TOKEN in .env):
auto_train = false          # after Jarvis closes, when min_new_pairs new pairs came since the last run
min_new_pairs = 50
every_hours = 20            # at most one automatic run in this many hours (Kaggle's GPU hours are weekly)
held_out = 0.15             # the newest pairs, never uploaded: the test a new model must pass before use
kaggle_dataset = "jarvis-standin-pairs"      # private, in your Kaggle account
kaggle_kernel = "jarvis-standin-training"    # private
timeout_min = 90

[emotion]
# How you sound (src/jarvis/perception/emotion.py, docs/TRAINING_EMOTION.md):
# a speech emotion model hears the same push-to-talk audio as Whisper, at the
# same time. Its guess reaches the LLM only as a hedged hint, only above
# min_confidence, and never "calm". Off until you turn it on: the first start
# downloads the model (about 380 MB) and it uses about 400 MB of the GPU.
enabled = false
model = "superb/wav2vec2-base-superb-er"   # the ready-made baseline (Apache-2.0, IEMOCAP)
device = "cuda"                           # "cpu" if the GPU is short of memory
min_confidence = 0.6
wait_s = 0.5                              # after Whisper; a later guess is dropped, never waited for
# Yours (level 2), when trained: a classifier on the model's features, from your /mood labels.
classifier = "models/emotion/emotion.joblib"
labels_dir = "data/emotion"               # /mood labels: features and labels only, no audio (gitignored)

[memory]
# What Jarvis remembers between sessions, in state/memory.json on this
# computer only (src/jarvis/memory.py): your name, facts you ask it to keep
# ("remember that ..."), and the conversation, which carries on after a
# restart if you talked within continue_hours. /memory shows it, /forget
# clears it.
enabled = true
keep_conversation = true
continue_hours = 12

[telemetry]
dir = "logs"

[llm]
# Providers are tried in this order. A provider is skipped when its API key
# is missing. Fallback happens only before the first word of a reply arrives.
# Ordered by speed measured on the laptop (2026-10-21): Groq's gpt-oss models
# answered in 0.2-0.3 s; Gemini took 7 s and was often overloaded (503). The
# same evening Gemini Flash took 19 s and Flash-Lite 9-15 s, or timed out 4
# times in 6, while Groq took about 1 s; so Gemini comes after OpenRouter (6 s)
# in the English orders. It stays first for long documents (big context), and
# before OpenRouter in Sinhala, which it writes best.
# Every kind of request ends with this order's models it hasn't tried, so each
# free limit is a last resort for the others (3 Nov: both gpt-oss models were at
# Groq's 200,000 tokens a day and OpenRouter at its 50 requests a day, while
# Qwen and Flash-Lite, with limits of their own, weren't on the list).
order = ["groq_oss", "groq", "groq_qwen", "openrouter", "gemini", "gemini_lite", "ollama"]
timeout_s = 20
# If a model hasn't sent anything this many seconds after the question, Jarvis
# asks the next model on the route instead (and leaves the slow one alone for
# 30 s). Laptop logs, 21-28 Oct: gpt-oss-120b's first chunk p50 0.9 s, p95
# 2.0 s, slowest 3.8 s; but gpt-oss-20b twice took 8.7 s and 13.3 s, which
# made those replies start 9-15 s late. Never applied to the last model left,
# so a slow answer still beats none; a model that's resting (at a limit, slow
# a moment ago, or unreachable like Ollama when it isn't running) doesn't count
# as one left, and when nothing answers, the ones that were only slow or
# unreachable are asked once more, waiting as long as it takes. 0: no deadline. Kinds of request that may
# wait longer are in [llm.first_chunk_s_by_route] below.
first_chunk_s = 4.5
# How much of the conversation goes to the model (characters). Groq's free tier
# allows 8,000 tokens a minute per model; older long replies are cut to their start.
history_chars = 6000
# Keep the connection to the provider open between turns (the default closes
# it after 5 s idle, so every spoken question first had to reconnect), and
# open it while you're still holding the push-to-talk key.
keepalive_s = 120
prewarm = true
# Different kinds of request go to different models (src/jarvis/agent/router.py
# decides the kind; `python -m jarvis.telemetry` shows which route each turn
# took). Free limits are counted per model, so spreading the work gives more
# answers per day, and each kind gets a model that suits it. Each route lists
# providers to try in order; "general" is `order` above. false: always `order`.
routing = true

# Long documents go to Gemini (7-19 s to the first chunk); thinking routes
# stream their reasoning early, but get more time too.
[llm.first_chunk_s_by_route]
long = 30
maths = 8
code = 8
problem = 40        # a worked problem's whole plan (JSON) comes after the model has thought it through
vision = 30

[llm.routes]
command = ["groq", "groq_oss", "gemini_lite", "ollama"]   # open apps, volume...: until Jarvis does these itself
quick = ["groq", "groq_oss", "gemini_lite", "ollama"]     # hi, thanks, the time: the fastest model
maths = ["groq_oss_think", "groq_qwen", "gemini", "openrouter", "ollama"]   # solve, derive, prove, check
teach = ["groq_oss", "groq_qwen", "openrouter", "gemini", "ollama"]         # explain, quiz, exam revision
code = ["groq_qwen", "groq_oss", "openrouter", "ollama"]                    # write and fix code, data, graphs
long = ["gemini", "gemini_lite", "openrouter", "groq_oss"]  # long documents: Groq's free 8K tokens/minute is too small
talk = ["groq_oss", "groq_qwen", "openrouter", "gemini", "ollama"]          # life, feelings, society
vision = ["gemini", "gemini_lite", "openrouter"]           # reading a photo of a problem (problem_mode.py)
problem = ["groq_oss_think", "gemini", "groq_qwen", "openrouter", "ollama"]   # planning a worked problem

# A language's own order, where it differs. Sinhala: in the smoke test of
# 21 Oct only gpt-oss-120b and Gemini wrote clean Sinhala; gpt-oss-20b made
# up a word, Qwen gave Jarvis a wrong name and OpenRouter's free model mixed
# in Hindi letters. So Sinhala goes to gpt-oss-120b first. (Maths already
# does: groq_oss_think is the same model. Long documents stay with Gemini.)
[llm.language_routes.si]
# Qwen last in Sinhala, for when the others are at their limits: weaker Sinhala beats no answer.
general = ["groq_oss", "gemini", "groq", "openrouter", "gemini_lite", "groq_qwen", "ollama"]
command = ["groq_oss", "groq", "gemini_lite", "ollama"]
quick = ["groq_oss", "groq", "gemini_lite", "ollama"]
teach = ["groq_oss", "gemini", "groq_qwen", "openrouter", "ollama"]
code = ["groq_oss", "groq_qwen", "gemini", "openrouter", "ollama"]
talk = ["groq_oss", "gemini", "groq_qwen", "openrouter", "ollama"]

# Model names change often. If the smoke test reports "model not found",
# look up the current free model name in that provider's console.
[llm.providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"
model = "gemini-flash-latest"
# Gemini's newer Flash models think before answering; on the first laptop run
# that took 7 s before the first word. "low" keeps the thinking short.
options = { reasoning_effort = "low" }

# Gemini's lighter model: its own free limits, higher than Flash's.
[llm.providers.gemini_lite]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"
model = "gemini-flash-lite-latest"

# Groq retired llama-3.3-70b-versatile on 2026-08-16 and recommends OpenAI's
# open-weight gpt-oss models (Apache-2.0) instead. Two of them, same key, each
# with its own free limits: the small one first because it's very fast, the
# big one as the stronger backup (and later for hard maths in the Study skill).
[llm.providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
model = "openai/gpt-oss-20b"
options = { reasoning_effort = "low" }

[llm.providers.groq_oss]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
model = "openai/gpt-oss-120b"
options = { reasoning_effort = "low" }

# The same model with more thinking, for maths (route "maths"). It shares
# gpt-oss-120b's free limits; the answer starts later but is more often right.
[llm.providers.groq_oss_think]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
model = "openai/gpt-oss-120b"
options = { reasoning_effort = "medium" }

# Groq's free Qwen model (its own limits; Qwen models are strong at code).
# Listed on Groq's rate-limits page in Oct 2026. If the smoke test says
# "model not found", copy the current Qwen name from console.groq.com.
# Its thinking is taken out of the reply automatically (llm.py, ThinkFilter).
[llm.providers.groq_qwen]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
model = "qwen/qwen3.8-27b"

# Free models come and go and get rate-limited (Gemma 4 returned 429 on the
# laptop), so this uses OpenRouter's free router, which picks any free model
# that can handle the request. A fixed one also works, e.g.
# "google/gemma-4-31b-it:free": https://openrouter.ai/models?max_price=0
[llm.providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "openrouter/free"

# Ollama, the model on this computer (docs/OLLAMA.md): no daily limit, no internet,
# the last model on every route. Jarvis starts it when he starts if it's
# installed and not running ("ollama serve", no window; logs/ollama.log).
[ollama]
start = true
path = ""            # ollama.exe, if it isn't on PATH (e.g. "D:/Ollama/app/ollama.exe")
models_dir = ""      # where its models are, if OLLAMA_MODELS isn't set (e.g. "D:/Ollama/models")

[llm.providers.ollama]
base_url = "http://localhost:11434/v1"
api_key_env = ""                # local: no key needed
model = "qwen3:4b"              # fits in 6 GB VRAM next to Whisper small
# Alternative to compare: "gemma4:e2b-it-qat" (Google Gemma 4, Apache-2.0,
# about 4.3 GB). Pull it first: ollama pull gemma4:e2b-it-qat
