# Jarvis settings. Values here are defaults; change them freely.

[general]
default_language = "en"        # a key from config/languages.toml
# "fixed": Jarvis keeps one language until you tell it to switch (recommended).
# "auto":  Jarvis follows the language Whisper detects in each utterance.
#          Experimental: detection on short commands is unreliable.
language_mode = "fixed"
# Small files Jarvis keeps between runs (e.g. when you last talked). Not committed.
state_dir = "state"

[greeting]
# Jarvis greets like a person: a full greeting the first time each day, a
# short "welcome back" after a break, and nothing extra within the same
# session. The lines are in config/languages.toml under [<code>.greetings].
enabled = true
same_session_minutes = 15     # talk again within this time = same session (10-20 feels natural)

[hotkeys]
# pynput hotkey syntax. These work from any app.
kill_switch = "<ctrl>+<alt>+k"
mute = "<ctrl>+<alt>+m"         # voice replies on/off (text still prints)
# Hold this single key to talk, release to send. Key names come from pynput:
# "ctrl_r" (right Ctrl), "alt_r", "f9", or one character such as "`".
push_to_talk = "ctrl_r"

[latency]
# Target from speech end to the first audio of the reply, for simple questions.
target_first_audio_ms = 1500

[audio]
sample_rate = 16000             # what Whisper expects
input_device = ""               # empty = Windows default microphone
output_device = ""              # empty = Windows default speakers
min_utterance_s = 0.35          # shorter key taps are ignored
max_utterance_s = 30

[stt]
model = "small"                 # multilingual; compare with "large-v3-turbo"
device = "cuda"                 # falls back to "cpu" if CUDA isn't available
compute_type = "int8_float16"   # use "int8" on CPU
vad_filter = true
beam_size = 1                   # 1 is fastest; 5 is a little more accurate
initial_prompt = "Jarvis"       # words Whisper should expect (names, apps)
# Check which language was spoken before transcribing (one extra encoder pass).
detect_language = true
# If Whisper hears a different language than the current one with at least this
# probability, Jarvis re-transcribes in that language before checking for a
# switch command. This is how "switch to English" still works in Sinhala mode.
retranscribe_threshold = 0.80

[tts]
kokoro_model = "models/kokoro-v1.0.onnx"
kokoro_voices = "models/voices-v1.0.bin"
piper_dir = "models/piper"
speed = 1.0                     # 0.9 = slower and calmer
# Start speaking as soon as the first short sentence is ready.
first_chunk_min_chars = 12
chunk_min_chars = 40
chunk_max_chars = 220
# Say a short filler ("Mm, one moment") if the real reply hasn't started
# speaking this long after the request went to the LLM. Once per turn at most.
fillers = true
filler_after_ms = 700

# The "Jarvis feel": a light studio chain applied to every reply.
# Set enabled = false to hear the raw voice.
[voice_style]
enabled = true
highpass_hz = 90                # remove rumble
low_shelf_db = 2.0              # a little more chest (below 250 Hz)
presence_db = 2.5               # clarity around 3 kHz
air_db = 2.0                    # crisp top end above 9 kHz
compressor_threshold_db = -20
compressor_ratio = 3.0          # even, controlled loudness
chorus_mix = 0.08               # faint synthetic shimmer; 0 = off
reverb_room = 0.14              # small, clean room
reverb_wet = 0.10
output_gain_db = 0.0
target_rms_db = -20.0           # same loudness for every voice and language

[vision]
camera_index = 0
num_hands = 1
hand_model = "models/hand_landmarker.task"

[telemetry]
dir = "logs"

[llm]
# Providers are tried in this order. A provider is skipped when its API key
# is missing. Fallback happens only before the first word of a reply arrives.
order = ["gemini", "groq", "groq_oss", "openrouter", "ollama"]
timeout_s = 20

# Model names change often. If the smoke test reports "model not found",
# look up the current free model name in that provider's console.
[llm.providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"
model = "gemini-flash-latest"
# Gemini's newer Flash models think before answering; on the first laptop run
# that took 7 s before the first word. "low" keeps the thinking short.
options = { reasoning_effort = "low" }

# Groq retired llama-3.3-70b-versatile on 2026-08-16 and recommends OpenAI's
# open-weight gpt-oss models (Apache-2.0) instead. Two of them, same key, each
# with its own free limits: the small one first because it's very fast, the
# big one as the stronger backup (and later for hard maths in the Study skill).
[llm.providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
model = "openai/gpt-oss-20b"
options = { reasoning_effort = "low" }

[llm.providers.groq_oss]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
model = "openai/gpt-oss-120b"
options = { reasoning_effort = "low" }

# The free model list changes often (Llama 3.3 70B stopped being free in
# 2026). Free models end in ":free": https://openrouter.ai/models?max_price=0
# "openrouter/free" also works: it picks any free model automatically.
[llm.providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "google/gemma-4-31b-it:free"

[llm.providers.ollama]
base_url = "http://localhost:11434/v1"
api_key_env = ""                # local: no key needed
model = "qwen3:4b"              # fits in 6 GB VRAM next to Whisper small
# Alternative to compare: "gemma4:e2b-it-qat" (Google Gemma 4, Apache-2.0,
# about 4.3 GB). Pull it first: ollama pull gemma4:e2b-it-qat
