<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="/lesson.js"></script>
<script defer src="/explore.js"></script>
<script defer src="/problem.js"></script>
<script defer src="/orb.js"></script>
<style>
:root { --bg:#03070d; --panel:#091522; --line:#12314a; --text:#eaf5ff; --muted:#8fa7ba; --cyan:#4de1ff;
        --amber:#ffb43b; --teal:#4ce2c4; --green:#64efb7; --red:#ff766f; --accent:var(--amber); }
body[data-speaker="Friday"] { --accent:var(--teal); }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
             font-family:"Segoe UI", "Iskoola Pota", "Nirmala UI", system-ui, sans-serif; }
header { display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--line); }
header h1 { margin:0; font-size:18px; font-weight:500; letter-spacing:6px; color:var(--accent); }
.pill { font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:3px 10px; }
.pill b { color:var(--text); font-weight:500; }
#link { margin-left:auto; }
main { display:grid; grid-template-columns:minmax(0,1fr) 360px; height:calc(100% - 53px); }
.stage { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; min-width:0;
         position:relative; }
#panel { position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg); z-index:5; }
#panel[hidden] { display:none; }
#panel .bar { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); }
#panel .bar b { font-weight:500; letter-spacing:2px; color:var(--cyan); font-size:12px; text-transform:uppercase; }
#panel .bar a, #panel .bar button { font-size:12px; color:var(--text); background:#12314a;
  border:1px solid #1c4766; border-radius:6px; padding:4px 10px; cursor:pointer; text-decoration:none; }
#panel .bar .push { margin-left:auto; }
#panel .bar .right { margin-left:auto; display:flex; gap:10px; align-items:center; }
#panel .bar #lessonCtl:not([hidden]) + .right { margin-left:10px; }
body.wide main { grid-template-columns:minmax(0,1fr) 0; }
body.wide main > aside { display:none; }
.wideBtn { font-size:12px; color:var(--text); background:#12314a; border:1px solid #1c4766; border-radius:6px;
  padding:4px 10px; cursor:pointer; }
.wideBtn:hover { border-color:var(--cyan); }
#panelCap { display:none; }
body.wide #panelCap:not(:empty) { display:block; padding:7px 14px; border-top:1px solid var(--line); font-size:14px;
  line-height:1.4; color:var(--text); max-height:4.4em; overflow:hidden; background:var(--panel); }
#panelCap .who { color:var(--muted); font-size:11px; letter-spacing:2px; text-transform:uppercase; margin-right:8px; }
#panel .bar [hidden] { display:none; }
#mapFrame { flex:1; border:0; width:100%; }
#mapFrame[hidden], #board[hidden], #lesson[hidden] { display:none; }
#panel .bar #lessonTitle { color:var(--text); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:40%; }
#panel .bar .mode { color:var(--accent); font-size:11px; letter-spacing:2px; text-transform:uppercase; }
#lesson { flex:1; display:flex; flex-direction:column; min-height:0; }
#explore { flex:1; display:flex; min-height:0; }
#explore[hidden] { display:none; }
#problem { flex:1; display:flex; flex-direction:column; min-height:0; }
#problem[hidden] { display:none; }
#problem .picks { padding:16px 20px; overflow:auto; }
#problem .picks h3 { margin:0 0 10px; font-weight:500; color:var(--cyan); font-size:14px; letter-spacing:2px; text-transform:uppercase; }
#problem .pick { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0; cursor:pointer; line-height:1.45; }
#problem .pick:hover { border-color:var(--cyan); background:#0a1a2a; }
#problem .pick b { color:var(--amber); margin-right:8px; }
body.dragging::after { content:"Drop a photo or PDF of a problem"; position:fixed; inset:12px; border:2px dashed var(--cyan);
  border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--cyan);
  background:#03070dcc; z-index:50; pointer-events:none; }
#lessonStage { flex:1; position:relative; min-height:240px; margin:12px 14px 0; background:var(--panel);
  border:1px solid var(--line); border-radius:12px; overflow:hidden; }
#lessonStage .scenebox { position:absolute; inset:0; }
#lessonStage .readout { position:absolute; left:10px; right:10px; bottom:8px; font-size:13px; line-height:1.4;
  color:var(--muted); background:#03070dcc; padding:5px 9px; border-radius:6px; pointer-events:none; }
#lessonStage .legend { position:absolute; top:8px; left:58px; }
#lessonStage .legend span { display:inline-flex; align-items:center; gap:6px; margin-right:14px; font-size:13px; color:var(--muted); }
#lessonStage .legend i { width:14px; height:3px; display:inline-block; }
#lessonStage .diagram { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  padding:16px; overflow:auto; }
#lessonStage .diagram svg { width:100%; max-width:860px !important; max-height:100%; height:auto; }
#lessonStage .raw { color:var(--cyan); font-family:Consolas, monospace; white-space:pre-wrap; }
#lessonStage .picture { position:absolute; inset:0; margin:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:6px; padding:12px; }
#lessonStage .picture img { max-width:100%; max-height:calc(100% - 30px); object-fit:contain; border-radius:8px; }
#lessonStage .picture figcaption a { color:var(--muted); font-size:12px; }
#lessonStage .formula.big { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:30px; padding:20px; overflow:auto; }
#lessonStage .sketchnote { font-size:11px; color:var(--amber); padding:4px 10px; height:24px; }
#lessonStage .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
#lessonFormula { padding:6px 14px 0; font-size:19px; overflow-x:auto; }
#lessonFormula:empty { display:none; }
#lessonSay { padding:10px 18px 2px; font-size:17px; line-height:1.5; min-height:3.2em; }
#lessonDots { display:flex; gap:6px; padding:6px 18px 12px; flex-wrap:wrap; }
#lessonDots button { width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--panel);
  color:var(--muted); font-size:12px; cursor:pointer; padding:0; }
#lessonDots button.seen { color:var(--text); border-color:#1c4766; }
#lessonDots button.now { background:var(--accent); color:var(--bg); border-color:var(--accent); }
#board { flex:1; overflow:auto; padding:22px 30px; }
#board h2 { margin:0 0 4px; font-size:22px; font-weight:500; color:var(--accent); }
#board .made { color:var(--muted); font-size:12px; margin-bottom:14px; }
#board .step { margin:14px 0; padding:12px 16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
#board .step .n { color:var(--muted); font-size:11px; letter-spacing:2px; }
#board .step .t { font-size:16px; line-height:1.5; margin:4px 0; }
#board .step .m { font-size:20px; overflow-x:auto; padding:4px 0; color:var(--text); }
#board .step .m.raw { font-family:Consolas, monospace; font-size:15px; color:var(--cyan); }
#board svg.plot { width:100%; max-width:760px; height:auto; background:var(--panel); border:1px solid var(--line);
  border-radius:10px; margin-top:14px; }
#board table.tbl { border-collapse:collapse; margin-top:6px; font-size:14px; }
#board pre.code { margin:6px 0 0; padding:10px 12px; background:#03070d; border:1px solid var(--line); border-radius:8px;
  font:13px/1.45 Consolas, "Cascadia Mono", monospace; color:var(--text); overflow:auto; max-height:360px; white-space:pre; }
#board img.fig { display:block; max-width:100%; margin-top:8px; border-radius:8px; background:#fff; }
#board .surfbox { position:relative; height:380px; max-width:760px; margin-top:10px; background:var(--panel);
  border:1px solid var(--line); border-radius:10px; overflow:hidden; }
#board .axes { color:var(--muted); font-size:12px; margin-top:4px; }
#board .cmap { position:relative; }
#board .maptip, .tip3d { position:absolute; pointer-events:none; background:#03070dee; border:1px solid #1c4766;
  border-radius:6px; padding:4px 8px; font-size:12px; color:var(--text); white-space:nowrap; z-index:3; }
#board .maptip[hidden] { display:none; }
#board .cmap canvas { width:100%; max-width:560px; aspect-ratio:4/3; image-rendering:pixelated; display:block;
  margin-top:8px; border:1px solid var(--line); border-radius:8px; }
#board table.tbl th, #board table.tbl td { border:1px solid var(--line); padding:6px 10px; text-align:left; }
#board table.tbl th { color:var(--cyan); font-weight:500; }
#board .legend span { display:inline-flex; align-items:center; gap:6px; margin-right:14px; font-size:13px; color:var(--muted); }
#board .legend i { width:14px; height:3px; display:inline-block; }
#orb { width:min(52vh, 90%); aspect-ratio:1; }
#status { margin-top:6px; font-size:14px; letter-spacing:3px; color:var(--accent); text-transform:uppercase; }
.captions { width:min(760px, 100%); margin-top:18px; }
.cap { margin:8px 0; font-size:17px; line-height:1.5; }
.cap .who { display:block; font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
#capJarvis { color:var(--text); } #capYou { color:var(--muted); }
#typeBox { display:flex; gap:8px; width:min(760px, 100%); margin-top:14px; }
#typeBox input { flex:1; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px;
  padding:9px 12px; font:inherit; font-size:15px; outline:none; }
#typeBox input:focus { border-color:var(--accent); }
#typeBox button { background:var(--accent); color:var(--bg); border:0; border-radius:8px; padding:0 16px; font:inherit;
  cursor:pointer; }
aside { background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:14px 16px; }
aside h2 { font-size:12px; font-weight:500; letter-spacing:2px; color:var(--cyan); text-transform:uppercase; margin:14px 0 8px; }
.item { font-size:13px; line-height:1.4; margin:6px 0; padding-bottom:6px; border-bottom:1px solid #0e2235; }
.item .meta { color:var(--muted); font-size:11px; }
.item a { color:var(--text); text-decoration:none; } .item a:hover { color:var(--cyan); }
.ok { color:var(--green); } .ask { color:var(--amber); } .no { color:var(--red); }
.empty { color:var(--muted); font-size:12px; }
#mapBtn, #boardBtn, #lessonBtn { display:inline-block; margin-top:6px; font-size:12px; color:var(--bg); background:var(--cyan);
          border-radius:6px; padding:5px 10px; text-decoration:none; }
#mapBtn[hidden], #boardBtn[hidden], #lessonBtn[hidden], #problemBtn[hidden] { display:none; }
#problemBtn { display:inline-block; margin-top:6px; font-size:12px; color:var(--bg); background:var(--cyan);
  border-radius:6px; padding:5px 10px; text-decoration:none; }
#offline { position:fixed; bottom:12px; left:12px; font-size:12px; color:var(--red); }
@media (max-width: 900px) { main { grid-template-columns:1fr; height:auto; } aside { border-left:0; } }
</style>
</head>
<body data-speaker="Jarvis" data-mode="idle">
<header>
  <h1 id="name">JARVIS</h1>
  <span class="pill">language <b id="lang">-</b></span>
  <span class="pill">model <b id="model">-</b></span>
  <span class="pill" id="pcPill" hidden>pc <b id="pc">-</b></span>
  <span class="pill" id="moodPill" hidden title="What the emotion model heard: a guess">sounds <b id="mood">-</b></span>
  <span class="pill" id="link">live</span>
  <button class="wideBtn" id="photoBtn" type="button" title="Jarvis reads the problem and works it through">Solve from a photo or PDF</button>
  <input type="file" id="photoFile" accept="image/png,image/jpeg,image/webp,application/pdf" hidden>
  <button class="wideBtn" id="wideTop" type="button">Hide conversation &#8250;</button>
</header>
<main>
  <section class="stage">
    <canvas id="orb" width="640" height="640" aria-label="Jarvis's orb"></canvas>
    <div id="status">idle</div>
    <div class="captions">
      <div class="cap"><span class="who">You</span><span id="capYou">-</span></div>
      <div class="cap"><span class="who" id="capWho">Jarvis</span><span id="capJarvis">-</span></div>
    </div>
    <form id="typeBox" autocomplete="off">
      <input id="typed" maxlength="2000" placeholder="Type to Jarvis, or hold the push-to-talk key and speak"
             aria-label="Type to Jarvis"><button type="submit">Send</button>
    </form>
    <div id="panel" hidden>
      <div class="bar"><b id="panelName">Map</b><span id="lessonTitle"></span><span id="lessonMode" class="mode"></span>
        <span id="lessonCtl" class="push" hidden>
          <button type="button" data-act="prev" title="The step before">Back</button>
          <button type="button" id="lessonPlay" data-act="pause">Pause</button>
          <button type="button" data-act="next" title="The next step">Next</button>
          <button type="button" data-act="again" title="Say this step again">Again</button></span>
        <span class="right"><button class="wideBtn" id="widePanel" type="button">Hide conversation &#8250;</button>
        <a id="mapOwn" href="/map" target="_blank" rel="noopener">Own window</a>
        <button id="panelClose" type="button">Back to Jarvis</button></span></div>
      <iframe id="mapFrame" title="Map" hidden></iframe>
      <div id="board" hidden></div>
      <div id="explore" hidden></div>
      <div id="problem" hidden></div>
      <div id="lesson" hidden>
        <div id="lessonStage"></div>
        <div id="lessonFormula"></div>
        <div id="lessonSay"></div>
        <div id="lessonDots"></div>
      </div>
      <div id="panelCap"></div>
    </div>
  </section>
  <aside>
    <h2>Conversation</h2><div id="talk"><div class="empty">Nothing yet.</div></div>
    <h2>Actions</h2><div id="actions"><div class="empty">No actions yet.</div></div>
    <h2>Timers</h2><div id="timers"><div class="empty">No timers.</div></div>
    <h2>Latest news</h2><div id="news"><div class="empty">Ask "what's the news today?"</div></div>
    <a id="mapBtn" href="/map" target="_blank" rel="noopener" hidden>Open the latest map</a>
    <a id="boardBtn" href="#" hidden>Open the board</a>
    <a id="lessonBtn" href="#" hidden>Open the lesson</a>
    <a id="problemBtn" href="#" hidden>Open the problem</a>
  </aside>
</main>
<div id="offline" hidden>Jarvis isn't running.</div>
<script>
const $ = id => document.getElementById(id);
const TOKEN = "__JARVIS_TOKEN__";
const LABELS = { idle: "idle", listening: "listening...", thinking: "thinking...", speaking: "speaking",
                 paused: "paused", gesture: "gesture mode" };
const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? u : null;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text; return e; }

// A reply's \( \) and \[ \] maths drawn as maths in the captions (KaTeX), the rest as plain text.
const MATH_IN_TEXT = /\\\((.+?)\\\)|\\\[(.+?)\\\]|\$\$(.+?)\$\$/gs;
function withMaths(box, text) {
  text = String(text || ""); box.textContent = "";
  let last = 0;
  for (const m of text.matchAll(MATH_IN_TEXT)) {
    if (m.index > last) box.append(document.createTextNode(text.slice(last, m.index)));
    const tex = m[1] || m[2] || m[3], span = el("span", "texin");
    try { if (!window.katex) throw 0; katex.render(tex, span, { displayMode: false, throwOnError: false, trust: false }); }
    catch (err) { span.textContent = tex; }                      // offline: the formula without its \( \)
    box.append(span); last = m.index + m[0].length;
  }
  if (last < text.length) box.append(document.createTextNode(text.slice(last)));
  return box;
}

function addTalk(who, text) {
  const box = $("talk"); if (box.querySelector(".empty")) box.textContent = "";
  const item = el("div", "item"); item.append(el("div", "meta", who), withMaths(el("div", ""), text));
  box.prepend(item); while (box.children.length > 30) box.lastChild.remove();
  const cap = $("panelCap"); cap.textContent = "";             // the latest line, under the panel, when it's wide
  cap.append(el("span", "who", who), withMaths(el("span", ""), text));
  if (document.body.classList.contains("wide")) { unseen += 1; wideLabels(); }
}
// The Conversation column can be hidden, for a bigger map, 3D model, board or lesson (remembered).
let unseen = 0;
function wideLabels() {
  const wide = document.body.classList.contains("wide");
  for (const b of [$("wideTop"), $("widePanel")]) {
    b.textContent = wide ? "\u2039 Show conversation" + (unseen ? ` (${unseen} new)` : "") : "Hide conversation \u203a";
    b.title = wide ? "Show the Conversation column again" : "Hide the Conversation column: more room";
  }
}
function setWide(wide) {
  document.body.classList.toggle("wide", wide);
  if (!wide) unseen = 0;
  wideLabels();
  try { localStorage.setItem("jarvisWide", wide ? "1" : ""); } catch (err) {}
}
for (const b of [$("wideTop"), $("widePanel")]) {
  b.addEventListener("click", () => setWide(!document.body.classList.contains("wide")));
}
try { setWide(localStorage.getItem("jarvisWide") === "1"); } catch (err) { setWide(false); }
function addAction(a) {
  const box = $("actions"); if (box.querySelector(".empty")) box.textContent = "";
  const cls = ["done", "claimed"].includes(a.status) ? "ok" : a.status === "cancelled" ? "ask" : "no";
  const item = el("div", "item");
  const head = el("div", "meta"); head.append(el("span", cls, a.status || ""), document.createTextNode(" · " + (a.tool || "")));
  item.append(head, el("div", "", a.text || "")); box.prepend(item);
  while (box.children.length > 12) box.lastChild.remove();
}
function showState(s) {
  if (!s) return;
  document.body.dataset.mode = s.mode || "idle";
  document.body.dataset.speaker = s.speaker || "Jarvis";
  $("name").textContent = (s.speaker || "Jarvis").toUpperCase();
  $("capWho").textContent = s.speaker || "Jarvis";
  $("status").textContent = LABELS[s.mode] || s.mode || "";
  $("lang").textContent = s.language || "-";
  $("model").textContent = s.provider || "-";
  $("pc").textContent = s.pc || "-"; $("pcPill").hidden = !s.pc;
  $("mood").textContent = s.mood || "-"; $("moodPill").hidden = !s.mood;
  const timers = $("timers"); timers.textContent = "";
  for (const t of s.timers || []) {
    const m = Math.floor(t.ends_in_s / 60), sec = String(Math.floor(t.ends_in_s % 60)).padStart(2, "0");
    timers.append(el("div", "item", `${t.label || "Timer"}: ${m}:${sec} left`));
  }
  if (!timers.children.length) timers.append(el("div", "empty", "No timers."));
  const news = $("news");
  if ((s.news || []).length) {
    news.textContent = "";
    s.news.slice(0, 8).forEach((n, i) => {
      const item = el("div", "item"); const href = safeUrl(n.url);
      const title = href ? el("a", "", `${i + 1}. ${n.title}`) : el("span", "", `${i + 1}. ${n.title}`);
      if (href) { title.href = href; title.target = "_blank"; title.rel = "noopener"; }
      item.append(title, el("div", "meta", `${n.source} · ${n.theme}`)); news.append(item);
    });
  }
  $("mapBtn").hidden = !s.map;
  $("boardBtn").hidden = !s.board;
  $("lessonBtn").hidden = !s.lesson;
  $("problemBtn").hidden = !s.problem;
  lastMode = s.mode || "idle";
  $("lessonMode").textContent = panel === "lesson" && lastMode !== "idle" ? (LABELS[lastMode] || "") : "";
}
$("typeBox").addEventListener("submit", async ev => {
  ev.preventDefault();
  const text = $("typed").value.trim(); if (!text) return;
  $("typed").value = "";
  try {
    const r = await fetch("/say", { method: "POST", body: JSON.stringify({ text }),
      headers: { "Content-Type": "application/json", "X-Jarvis-Token": TOKEN } });
    if (!r.ok) throw new Error(r.status);
  } catch (err) { $("typed").value = text; $("offline").hidden = false; }
});
// ---- the panel over the orb: a map (news, weather), the board (working, formulas, graphs) or a lesson ----
let panel = "", pendingMapCmds = [], lastMode = "idle";
function post(body) {
  return fetch("/ui", { method: "POST", body: JSON.stringify(body),
    headers: { "Content-Type": "application/json", "X-Jarvis-Token": TOKEN } }).catch(() => {});
}
function tellJarvis(kind) { post({ panel: kind }); }   // which panel shows: Jarvis offers map tools then
const PANEL_NAMES = { map: "Map", board: "Board", lesson: "Lesson", explore: "Explore", problem: "Problem" };
// ---- worked problems: parts, hints, steps and their animations (problem.js) ----
let problemApi = null;
function stopProblem() { if (problemApi) { problemApi.stop(); problemApi = null; } }
function startProblem(data, state) {
  if (!data || !Array.isArray(data.parts)) return;
  openPanel("problem"); stopProblem();
  const go = () => { problemApi = JarvisProblem.open($("problem"), data, { post, state }); };
  window.JarvisProblem ? go() : window.addEventListener("load", go, { once: true });
}
function showPicks(questions) {
  openPanel("problem"); stopProblem();
  const box = $("problem"); box.textContent = "";
  const list = el("div", "picks"); list.append(el("h3", "", "Which question?"));
  questions.forEach((q, i) => { const row = el("div", "pick"); row.append(el("b", "", q.label), document.createTextNode(q.text));
    row.addEventListener("click", () => { post({ problem: "pick", index: i }); list.textContent = "Working it out..."; }); list.append(row); });
  box.append(list);
}
function openProblem() { fetch("/problem").then(r => r.json()).then(d => { if (d && d.data) startProblem(d.data, d.state); }).catch(() => {}); }
// a photo or PDF of a problem: the button, a drop on the window, or a pasted screenshot
function sendProblemFile(file) {

    const card = el("div", "step"); card.append(el("div", "n", "STEP " + (i + 1)));
    if (st.text) card.append(el("div", "t", st.text));
    if (st.math) { const m = el("div", "m"); maths(m, st.math); card.append(m); }
    if (st.code) card.append(el("pre", "code", String(st.code)));                   // MATLAB code and its output
    if (/^\/figure\/run-[\d-]+\/figure[1-8]\.(png|svg)$/.test(String(st.image || ""))) {  // a MATLAB figure, Jarvis's own
      const img = el("img", "fig"); img.src = st.image; img.alt = st.text || "figure"; card.append(img);
    }
    if (st.plot && typeof st.plot === "object") {                    // MATLAB's figure, drawn from its data
      const svg = figure2d(st.plot); if (svg) card.append(svg);
      const named = [...(st.plot.bars || []), ...(st.plot.curves || [])];
      const legend = el("div", "legend");
      named.forEach((p, k) => { const s = el("span"); const sw = el("i"); sw.style.background = COLOURS[k % 3];
        s.append(sw, document.createTextNode(p.label)); legend.append(s); });
      if ((st.plot.arrows || []).length) legend.append(el("span", "", "arrows: the vector field"));
      if (legend.children.length > 1 || (st.plot.arrows || []).length) card.append(legend);
      const axes = [st.plot.xlabel && "x: " + st.plot.xlabel + (st.plot.xscale ? " (log)" : ""),
                    st.plot.ylabel && "y: " + st.plot.ylabel + (st.plot.yscale ? " (log)" : "")].filter(Boolean);
      if (axes.length) card.append(el("div", "axes", axes.join("  ·  ")));
    }
    if (st.grid && Array.isArray(st.grid.z)) { const cm = colourMap(st.grid); if (cm) card.append(cm); }
    if (st.curve3d && Array.isArray(st.curve3d.curves) && window.JarvisLesson && JarvisLesson.curvesIn) {
      const box3 = el("div", "surfbox"); card.append(box3);
      boardScenes.push(JarvisLesson.curvesIn(box3, st.curve3d));                // drag to turn it
    }
    if (st.surface && Array.isArray(st.surface.z) && window.JarvisLesson && JarvisLesson.surfaceIn) {
      const surf = el("div", "surfbox"); card.append(surf);
      boardScenes.push(JarvisLesson.surfaceIn(surf, st.surface));                // drag to turn it
    }
    if (Array.isArray(st.table) && st.table.length) {
      const t = el("table", "tbl");
      st.table.forEach((row, r) => { const tr = el("tr");
        (row || []).forEach(c => tr.append(el(r ? "td" : "th", "", String(c)))); t.append(tr); });
      card.append(t);
    }
    box.append(card);
  });
  if ((b.plots || []).length) {
    const svg = graph(b.plots); if (svg) box.append(svg);
    const legend = el("div", "legend");
    b.plots.forEach((p, i) => { const s = el("span"); const sw = el("i"); sw.style.background = COLOURS[i % 3];
      s.append(sw, document.createTextNode(p.label)); legend.append(s); });
    box.append(legend);
  }
  openPanel("board");
}
function onEvent(e) {
  if (e.kind === "voice") { if (window.JarvisOrb) JarvisOrb.voice(e.env, e.step); return; }   // the orb follows his voice
  if (e.kind === "mic") { if (window.JarvisOrb) JarvisOrb.mic(e.level); return; }            // and yours
  if (e.kind === "map") showMap(e.url);
  else if (e.kind === "map_cmd") mapCmd(e);
  else if (e.kind === "board") showBoard(e);
  else if (e.kind === "panel" && e.action === "close") closePanel();
  else if (e.kind === "lesson") startLesson(e, 0, true);
  else if (e.kind === "lesson_step") lessonStep(e);
  else if (e.kind === "lesson_patch" && e.id === lessonId && window.JarvisLesson) JarvisLesson.patch(e.step, e.code);
  else if (e.kind === "explore") startExplore(e);
  else if (e.kind === "problem") startProblem(e.data, e.state);
  else if (e.kind === "wide") setWide(!!e.on);
  else if (e.kind === "problem_state") { if (problemApi && panel === "problem") problemApi.state(e.state); }
  else if (e.kind === "problem_pick") showPicks(e.questions || []);
  else if (e.kind === "problem_close") { if (panel === "problem") closePanel(); }
  else if (e.kind === "explore_hand") { if (exploreApi && panel === "explore") exploreApi.hands(e); }
  else if (e.kind === "explore_cmd") { if (exploreApi) exploreApi.command(e); }
  else if (e.kind === "explore_close") { if (panel === "explore") closePanel(); }
  else if (e.kind === "state") showState(e.state);
  else if (e.kind === "you") { $("capYou").textContent = e.text; addTalk("You", e.text); }
  else if (e.kind === "jarvis") { withMaths($("capJarvis"), e.text); addTalk(e.speaker || "Jarvis", e.text); }
  else if (e.kind === "action") addAction(e);
}

fetch("/state").then(r => r.json()).then(d => {
  showState(d.state);
  for (const e of d.history || []) onEvent(e);
  unseen = 0; wideLabels();                               // what was said before isn't new
  if (d.state && d.state.problem_open) openProblem();     // opened while a problem is on
  // Opened while a lesson plays (the window was closed when it started): show it.
  if (d.state && d.state.lesson && d.state.lesson.playing && !lessonData) {
    const go = () => openLesson();
    window.JarvisLesson ? go() : window.addEventListener("load", go, { once: true });
  }
}).catch(() => {});
let source;
function connect() {
  source = new EventSource("/events");
  source.onmessage = m => { try { onEvent(JSON.parse(m.data)); } catch (err) {} };
  source.onopen = () => { $("offline").hidden = true; $("link").textContent = "live"; };
  source.onerror = () => { $("offline").hidden = false; $("link").textContent = "offline"; };
}
connect();

// ---- the orb: the liquid sphere (orb.js, WebGL); without WebGL this particle sphere ----
// gold for Jarvis, teal for Friday
const canvas = $("orb");
let ctx = null;
const N = 900, pts = [];
for (let i = 0; i < N; i++) {                       // points spread evenly over a sphere
  const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));
  pts.push([Math.cos(th) * r, y, Math.sin(th) * r]);
}
const look = { idle: [0.15, 0.55, 0.92], listening: [0.35, 0.8, 1.0], thinking: [1.2, 0.75, 0.95],
               speaking: [0.5, 1.0, 1.05], paused: [0.05, 0.3, 0.85], gesture: [0.3, 0.7, 0.95] };
let angle = 0, last = performance.now();
function colour() { return getComputedStyle(document.body).getPropertyValue("--accent").trim() || "#ffb43b"; }
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const mode = document.body.dataset.mode, [spin, glow, size] = look[mode] || look.idle;
  angle += dt * spin;
  const W = canvas.width, C = W / 2, base = W * 0.3 * size;
  const pulse = mode === "listening" ? 1 + 0.05 * Math.sin(now / 180) : mode === "speaking" ? 1 + 0.04 * Math.sin(now / 90) : 1;
  const R = base * pulse, col = colour();
  ctx.clearRect(0, 0, W, W);
  const g = ctx.createRadialGradient(C, C, 0, C, C, R * 0.9);
  g.addColorStop(0, col); g.addColorStop(0.25, col + "66"); g.addColorStop(1, "transparent");
  ctx.globalAlpha = glow; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(C, C, R * 0.9, 0, 7); ctx.fill();
  if (mode === "speaking") {                        // rays
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    for (let k = 0; k < 24; k++) {
      const a = k / 24 * Math.PI * 2 + angle * 0.5, len = R * (1.15 + 0.12 * Math.sin(now / 70 + k));
      ctx.globalAlpha = 0.25; ctx.beginPath();
      ctx.moveTo(C + Math.cos(a) * R * 1.02, C + Math.sin(a) * R * 1.02);
      ctx.lineTo(C + Math.cos(a) * len, C + Math.sin(a) * len); ctx.stroke();
    }
  }
  const ca = Math.cos(angle), sa = Math.sin(angle), tilt = 0.35, ct = Math.cos(tilt), st = Math.sin(tilt);
  ctx.fillStyle = col;
  for (const [x, y, z] of pts) {                    // rotate, tilt, project
    const x1 = x * ca + z * sa, z1 = -x * sa + z * ca, y1 = y * ct - z1 * st, z2 = y * st + z1 * ct;
    const depth = (z2 + 1.6) / 2.6;
    ctx.globalAlpha = Math.max(0.05, depth * glow * 0.9);
    ctx.fillRect(C + x1 * R, C + y1 * R, 1.6 * depth + 0.4, 1.6 * depth + 0.4);
  }
  if (mode === "thinking") {                        // rings and orbiting sparks
    ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    for (let k = 0; k < 3; k++) {
      ctx.globalAlpha = 0.35; ctx.beginPath();
      ctx.ellipse(C, C, R * 1.25, R * 0.35, angle * (k + 1) * 0.7 + k, 0, Math.PI * 2); ctx.stroke();
      const a = angle * 3 + k * 2.1;
      ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(C + Math.cos(a) * R * 1.25, C + Math.sin(a) * R * 0.5, 3, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);                    // the browser pauses this when the page is hidden
}
window.addEventListener("DOMContentLoaded", () => {   // after orb.js (deferred) has loaded
  if (!(window.JarvisOrb && JarvisOrb.start(canvas))) {
    ctx = canvas.getContext("2d");
    requestAnimationFrame(frame);
  }
});
</script>
